services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: client_portfolio
      POSTGRES_USER: portfolio_user
      POSTGRES_PASSWORD: portfolio_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio_user -d client_portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
