{% extends "portfolio/base.html" %}

{% block content %}
  <section class="panel" style="position: relative;">
    <div style="display:flex;justify-content:space-between;gap:16px;align-items:center;">
      <div style="flex:1;">
        <h1>Клиенты</h1>
        <label for="client-search">Поиск по названию или ИНН</label>
        <input id="client-search" type="search" value="{{ query }}" placeholder="Начните вводить клиента">
        <div id="suggestions" class="suggest-box" hidden></div>
      </div>
      <button class="primary" style="max-width:180px;" onclick="document.getElementById('client-modal').showModal()">+ Новый клиент</button>
    </div>
  </section>

  <section class="panel">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Название</th><th>ИНН</th><th>Адрес</th></tr></thead>
        <tbody id="client-results">
          {% for client in clients %}
            <tr><td><a href="{% url 'client_detail' client.id %}">{{ client.name }}</a></td><td>{{ client.inn }}</td><td>{{ client.address }}</td></tr>
          {% empty %}
            <tr><td colspan="3" class="muted">Клиенты не найдены.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </section>

  <dialog id="client-modal" class="modal">
    <form class="modal-body" method="post" action="{% url 'client_create' %}">
      {% csrf_token %}
      <h2>Новый клиент</h2>
      {{ client_form.as_p }}
      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button type="button" onclick="document.getElementById('client-modal').close()">Отмена</button>
        <button class="primary" type="submit">Сохранить</button>
      </div>
    </form>
  </dialog>

  <script>
    (() => {
      const input = document.getElementById('client-search');
      const results = document.getElementById('client-results');
      const suggestions = document.getElementById('suggestions');
      let timer = null;
      const row = (item) => `<tr><td><a href="${item.url}">${item.name}</a></td><td>${item.inn || ''}</td><td>${item.address || ''}</td></tr>`;
      const render = (items) => {
        results.innerHTML = items.length ? items.map(row).join('') : '<tr><td colspan="3" class="muted">Клиенты не найдены.</td></tr>';
        suggestions.hidden = !items.length || !input.value;
        suggestions.innerHTML = items.map((item) => `<a href="${item.url}">${item.highlight || item.name}<br><span class="muted">${item.inn || ''}</span></a>`).join('');
      };
      input.addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(async () => {
          const response = await fetch(`/clients/search/?q=${encodeURIComponent(input.value)}`);
          render((await response.json()).results);
        }, 300);
      });
    })();
  </script>
{% endblock %}
