services:
  - type: web
    name: client-portfolio
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "python manage.py migrate && python manage.py ensure_default_users && python manage.py prepare_demo_database && gunicorn client_portfolio.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,https://client-portfolio-djlh.onrender.com"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "3600"
      - key: PYTHON_VERSION
        value: "3.12.7"
